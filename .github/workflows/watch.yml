name: watch
on:
  workflow_dispatch: {}
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      APP_REPO: "NowHereHappy/aw-d02cb9f1"
      SITE_REPO: ${{ github.repository }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          repository: "NowHereHappy/aw-d02cb9f1"
          token: ${{ secrets.GH_PAT }}
          path: app
      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: install
        run: pip install -q -r app/requirements.txt
      - name: run
        working-directory: app
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SECRETS_YAML: ${{ secrets.SECRETS_YAML }}
        run: python run.py cloud
