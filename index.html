<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1013">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>관심단지 시세표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --page:#f4f6f7; --surface:#ffffff; --surface-2:#eef1f3; --sunk:#f8fafb;
  --ink:#10161c; --ink-2:#47525c; --ink-3:#727e8a;
  --rule:#e2e7ea; --rule-strong:#cdd5da;
  --accent:#1c4f7c;
  --series-rt:#2a78d6; --series-ask:#eb6834;
  --down:#1a5fb4; --down-bg:#e6effa; --deep-bg:#1a5fb4; --deep-ink:#ffffff;
  --up:#c0392b;
  --urgent:#d03b3b; --urgent-ink:#ffffff; --urgent-wash:#fdf1f1;
  --grid:#e8ecee; --axis:#cdd5da;
  --shadow:0 1px 2px rgba(16,22,28,.05), 0 8px 24px -16px rgba(16,22,28,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d1013; --surface:#181b1e; --surface-2:#22262a; --sunk:#131619;
    --ink:#f2f5f7; --ink-2:#b9c2ca; --ink-3:#8a95a0;
    --rule:#282d32; --rule-strong:#3a4147;
    --accent:#7fb2e0;
    --series-rt:#3987e5; --series-ask:#d95926;
    --down:#7db4f5; --down-bg:#18283b; --deep-bg:#2a6fd0; --deep-ink:#ffffff;
    --up:#f1968c;
    --urgent:#e25555; --urgent-ink:#ffffff; --urgent-wash:#241617;
    --grid:#23282c; --axis:#3a4147;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d1013; --surface:#181b1e; --surface-2:#22262a; --sunk:#131619;
  --ink:#f2f5f7; --ink-2:#b9c2ca; --ink-3:#8a95a0;
  --rule:#282d32; --rule-strong:#3a4147;
  --accent:#7fb2e0;
  --series-rt:#3987e5; --series-ask:#d95926;
  --down:#7db4f5; --down-bg:#18283b; --deep-bg:#2a6fd0; --deep-ink:#ffffff;
  --up:#f1968c;
  --urgent:#e25555; --urgent-ink:#ffffff; --urgent-wash:#241617;
  --grid:#23282c; --axis:#3a4147;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:"IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  font-size:16px; line-height:1.45; padding-bottom:env(safe-area-inset-bottom);
}
.num{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:680px; margin:0 auto; padding:0 12px 72px}
button{font:inherit; color:inherit}

/* ── 머리 ───────────────────────────────── */
header{position:sticky; top:0; z-index:30; background:var(--page); border-bottom:1px solid var(--rule); padding-top:env(safe-area-inset-top)}
.hd{max-width:680px; margin:0 auto; padding:12px 12px 10px}
.hd-top{display:flex; align-items:center; justify-content:space-between; gap:10px}
h1{margin:0; font-size:19px; font-weight:700; letter-spacing:-.01em}
.stamp{font-size:12.5px; color:var(--ink-3); white-space:nowrap}
.bar{display:flex; gap:6px; overflow-x:auto; padding-top:10px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; border:1px solid var(--rule-strong); background:var(--surface); color:var(--ink-2);
  font-size:14px; padding:7px 12px; border-radius:8px; cursor:pointer; white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--surface); font-weight:600}
.chip.set{border-style:dashed}
.chip.set[aria-pressed="true"]{border-style:solid}
.sep{flex:0 0 auto; width:1px; background:var(--rule); margin:4px 2px}

/* ── 보기 설정 ──────────────────────────── */
.panel{margin-top:14px; background:var(--surface); border:1px solid var(--rule-strong); border-radius:12px; padding:14px 14px 6px; box-shadow:var(--shadow)}
.panel h2{margin:0 0 8px; font-size:14px; font-weight:700; color:var(--ink)}
.panel .hint{font-size:12.5px; color:var(--ink-3); margin:-2px 0 10px}
.pick-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.cx{border-top:1px solid var(--rule); padding:11px 0 12px}
.cx-hd{display:flex; align-items:center; gap:9px; font-size:15.5px; font-weight:600; cursor:pointer}
.cx-hd .rg{font-size:12.5px; font-weight:400; color:var(--ink-3)}
.cx-areas{display:flex; flex-wrap:wrap; gap:7px; margin:9px 0 0 31px}
input[type="checkbox"]{width:22px; height:22px; margin:0; flex:0 0 auto; accent-color:var(--accent)}
.ar{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--rule-strong); border-radius:9px;
  padding:6px 11px 6px 8px; font-size:14.5px; cursor:pointer; background:var(--sunk)}
.ar .pr{font-size:12.5px; color:var(--ink-3)}
.ar input{width:19px; height:19px}

/* ── 표 ─────────────────────────────────── */
.sum{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:16px 2px 8px; font-size:13.5px; color:var(--ink-3)}
.sum b{color:var(--ink); font-weight:600}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.cols{display:grid; grid-template-columns:1fr 1fr 1fr 1.08fr; gap:0 4px}
.thead{background:var(--sunk); border-bottom:1px solid var(--rule-strong); padding:8px 12px;
  font-size:12.5px; font-weight:600; color:var(--ink-3)}
.thead div{text-align:right}
.ghead{background:var(--surface-2); padding:6px 12px; font-size:13px; font-weight:600; color:var(--ink-2); border-bottom:1px solid var(--rule)}
.row{display:block; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--rule);
  padding:11px 12px 12px; cursor:pointer}
.row:last-child{border-bottom:0}
.row.urgent{background:var(--urgent-wash); box-shadow:inset 4px 0 0 var(--urgent)}
.row.open{background:var(--sunk)}
.r1{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px}
.nm{font-size:16.5px; font-weight:700; letter-spacing:-.01em; min-width:0; word-break:keep-all; overflow-wrap:anywhere}
.nm .ar2{font-weight:500; color:var(--ink-2); margin-left:5px}
.where{flex:0 0 auto; font-size:13px; color:var(--ink-3); white-space:nowrap}
.badge{display:inline-block; background:var(--urgent); color:var(--urgent-ink); font-size:12.5px; font-weight:700;
  padding:1px 8px 2px; border-radius:6px; margin-left:7px; vertical-align:2px; letter-spacing:.02em}
.tag{display:inline-block; font-size:11.5px; padding:0 5px; border-radius:5px; border:1px solid var(--rule-strong);
  color:var(--ink-3); margin-left:5px; vertical-align:1px; font-weight:500}
.v{text-align:right; min-width:0}
.v .a{font-size:17.5px; font-weight:600; letter-spacing:-.02em; line-height:1.2}
.v .s{font-size:12px; color:var(--ink-3); margin-top:2px; white-space:nowrap}
.v.ask .a{font-weight:700}
.v.ref .a{color:var(--ink-2); font-weight:500}
.gap .a{display:inline-block; padding:1px 7px 2px; border-radius:7px; font-weight:700; margin-right:-3px}
.gap.down .a{color:var(--down); background:var(--down-bg)}
.gap.deep .a{color:var(--deep-ink); background:var(--deep-bg)}
.gap.up .a{color:var(--up)}
.gap.none .a{color:var(--ink-3); font-weight:500}
.empty{padding:30px 14px; text-align:center; color:var(--ink-3); font-size:14.5px}

/* ── 펼침 상세 ──────────────────────────── */
.detail{padding:4px 12px 14px; background:var(--sunk); border-bottom:1px solid var(--rule)}
.legend{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:8px 0 4px; font-size:13px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.swatch{width:12px; height:3px; border-radius:2px; flex:0 0 auto}
.mini{border:1px solid var(--rule-strong); background:var(--surface); font-size:13px; padding:4px 10px; border-radius:7px; cursor:pointer; color:var(--ink-3)}
.mini[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); font-weight:600}
svg{display:block; width:100%; height:auto; touch-action:pan-y}
.lst-hd{margin:12px 0 2px; font-size:13px; color:var(--ink-3)}
.li{display:flex; align-items:baseline; gap:10px; padding:8px 0; border-top:1px solid var(--rule); font-size:14.5px}
.li.low{opacity:.55}
.li .p{font-weight:600; min-width:84px}
.li .m{color:var(--ink-2); font-size:13.5px; flex:1 1 auto; min-width:0}
.li .g{font-size:13.5px; font-weight:600; white-space:nowrap}
.li .g.down{color:var(--down)} .li .g.up{color:var(--up)}
.more{display:inline-block; margin-top:12px; font-size:13.5px; color:var(--accent)}
.tt{position:absolute; pointer-events:none; z-index:40; opacity:0; transition:opacity .1s;
  background:var(--surface); border:1px solid var(--rule-strong); border-radius:8px;
  box-shadow:var(--shadow); padding:8px 10px; font-size:13px; min-width:150px}
.tt .m{font-weight:600; margin-bottom:4px; font-size:12.5px; color:var(--ink-3)}
.tt .r{display:flex; justify-content:space-between; gap:12px; line-height:1.6}
.tt .r i{font-style:normal; color:var(--ink-2); display:inline-flex; align-items:center; gap:5px}
.foot{margin-top:22px; font-size:12.5px; color:var(--ink-3); line-height:1.7}
.foot li{margin-bottom:2px}
.foot ul{margin:0; padding-left:18px}
/* ── 알림 · 단지 관리 ───────────────────── */
.admin{margin-top:6px; border-top:2px solid var(--rule-strong); padding-top:14px}
.addrow{display:flex; gap:7px; margin-bottom:14px}
.addrow input{flex:1 1 auto; min-width:0; font:inherit; font-size:14.5px; padding:9px 11px; border-radius:9px;
  border:1px solid var(--rule-strong); background:var(--sunk); color:var(--ink)}
.btn{flex:0 0 auto; border:1px solid var(--accent); background:var(--accent); color:var(--surface);
  font-size:14px; font-weight:600; padding:8px 13px; border-radius:9px; cursor:pointer; white-space:nowrap}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.warn{background:transparent; color:var(--urgent); border-color:var(--urgent); font-weight:500; padding:5px 10px; font-size:13px}
.adm-cx{border-top:1px solid var(--rule); padding:11px 0 12px}
.adm-hd{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:15.5px; font-weight:600}
.adm-hd .rg{font-size:12.5px; font-weight:400; color:var(--ink-3); margin-left:6px}
.bells{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px}
.bell{border:1px solid var(--rule-strong); border-radius:9px; padding:6px 11px; font-size:14.5px; cursor:pointer;
  background:var(--sunk); color:var(--ink-3)}
.bell.on{border-color:var(--accent); color:var(--accent); background:var(--surface); font-weight:600}
.bell.all{font-size:13px; padding:6px 10px}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:50; max-width:92vw;
  background:var(--ink); color:var(--surface); font-size:14px; padding:10px 14px; border-radius:10px;
  box-shadow:var(--shadow)}

/* ── 잠금 화면 ──────────────────────────── */
.lock{max-width:400px; margin:56px auto 0; padding:24px 20px 22px; background:var(--surface);
  border:1px solid var(--rule-strong); border-radius:14px; box-shadow:var(--shadow)}
.lock h2{margin:0 0 6px; font-size:18px; font-weight:700}
.lock p{margin:0 0 16px; font-size:14px; color:var(--ink-3)}
.lock input[type="password"]{width:100%; font:inherit; font-size:17px; padding:12px 13px; border-radius:9px;
  border:1px solid var(--rule-strong); background:var(--sunk); color:var(--ink)}
.lock label{display:flex; align-items:center; gap:9px; margin:13px 0 16px; font-size:14.5px; color:var(--ink-2); cursor:pointer}
.lock .go{width:100%; padding:12px; border:0; border-radius:9px; background:var(--accent); color:var(--surface);
  font-size:16px; font-weight:600; cursor:pointer}
.lock .go:disabled{opacity:.6}
.lock .err{min-height:20px; margin-top:11px; font-size:14px; color:var(--urgent)}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-radius:4px}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="hd-top">
      <h1>관심단지 시세표</h1>
      <div class="stamp">11/13 17:10 기준</div>
    </div>
    <div class="bar" id="bar"></div>
  </div>
</header>

<div class="wrap" id="lockwrap" hidden>
  <form class="lock" id="lockform" autocomplete="off">
    <h2>비밀번호를 입력하세요</h2>
    <p>이 시세표는 비밀번호를 아는 사람만 볼 수 있습니다.</p>
    <input type="password" id="lockpw" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <label><input type="checkbox" id="lockkeep" checked> 이 기기에서 기억하기</label>
    <button class="go" id="lockgo" type="submit">열기</button>
    <div class="err" id="lockerr" role="alert"></div>
  </form>
</div>

<div class="wrap" id="appwrap" hidden>
  <div id="panel"></div>
  <main id="app"></main>
  <div class="foot">
    <ul>
      <li>금액 단위는 억원입니다.</li>
      <li><b>최저호가</b>는 그 평형에서 가장 싼 매물 1건이며, 저층(1~2층과 네이버가 '저'로 표시한 매물)은 뺐습니다.</li>
      <li><b>전고점</b>은 <span id="fromNote"></span> 이후 실거래 중 그 평형의 최고가입니다.</li>
      <li>호가는 네이버페이 부동산, 실거래는 국토교통부 자료입니다. 참고용이니 계약 전에 직접 확인하세요.</li>
    </ul>
  </div>
</div>

<script>
"use strict";
function startApp(DATA){
document.getElementById("appwrap").hidden = false;
if(DATA.schedule){
  const st = document.querySelector(".stamp");
  if(st) st.textContent = DATA.generated_at + " 기준 · 30분마다";
}
const FROM = DATA.data_from || "202101";
document.getElementById("fromNote").textContent = FROM.slice(0,4) + "년 " + Number(FROM.slice(4,6)) + "월";

/* ── 저장 (이 기기의 브라우저에만 남는다) ─────────────── */
const STORE = "aptwatch.view.v2";
function loadView(){
  try{
    const v = JSON.parse(localStorage.getItem(STORE) || "{}");
    return {off: new Set(v.off || []), drop: (typeof v.drop === "number" ? v.drop : null)};
  }catch(e){ return {off: new Set(), drop: null}; }
}
function saveView(){
  try{ localStorage.setItem(STORE, JSON.stringify({off: [...view.off], drop: state.drop})); }catch(e){}
}
const view = loadView();

const state = {
  sort: "gap", urgentOnly: false, open: null, range: 36, panel: false,
  drop: view.drop !== null ? view.drop : (DATA.drop_pct || 10)
};
const SORTS = [["gap","낙폭 큰 순"],["name","단지별"],["ask","싼 순"]];
const DROPS = [...new Set([5, 10, 15, 20, DATA.drop_pct || 10])].sort((a,b) => a - b);

/* ── 포맷 ───────────────────────────────── */
function eok(man){ return (man === null || man === undefined) ? "–" : (man/10000).toFixed(1); }
function eokFull(man){
  if(man === null || man === undefined) return "–";
  man = Math.round(man);
  const e = Math.floor(man/10000), r = man%10000;
  if(e && r) return e + "억 " + r.toLocaleString();
  if(e) return e + "억";
  return r.toLocaleString() + "만";
}
function sgnPct(v){ return (v === null || v === undefined) ? "–" : (v >= 0 ? "+" : "") + v.toFixed(1) + "%"; }
function sgnEok(man){
  if(man === null || man === undefined) return "";
  return (man >= 0 ? "+" : "-") + (Math.abs(man)/10000).toFixed(1) + "억";
}
function ym(s){ return s ? "'" + s.slice(2,4) + "." + s.slice(4,6) : ""; }
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function el(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html !== undefined) n.innerHTML = html;
  return n;
}

/* ── 판정 ───────────────────────────────── */
function isUrgent(r){
  return r.gap_pct !== null && r.gap_pct !== undefined && r.gap_pct <= -state.drop && !r.ask_fallback;
}
function gapClass(g){
  if(g === null || g === undefined) return "none";
  if(g <= -state.drop) return "deep";
  return g < 0 ? "down" : "up";
}
function visibleRows(){
  let r = DATA.rows.filter(x => !view.off.has(x.key));
  if(state.urgentOnly) r = r.filter(isUrgent);
  const big = 1e12;
  if(state.sort === "gap")
    r.sort((a,b) => (a.gap_pct === null ? big : a.gap_pct) - (b.gap_pct === null ? big : b.gap_pct));
  else if(state.sort === "ask")
    r.sort((a,b) => a.ask - b.ask);
  else
    r.sort((a,b) => a.region.localeCompare(b.region, "ko")
      || a.complex_name.localeCompare(b.complex_name, "ko") || a.area - b.area);
  return r;
}

/* ── 머리 막대 ──────────────────────────── */
function chip(host, label, pressed, fn, cls){
  const b = document.createElement("button");
  b.className = "chip" + (cls ? " " + cls : "");
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.textContent = label;
  b.onclick = fn;
  host.appendChild(b);
  return b;
}
function renderBar(){
  const bar = document.getElementById("bar");
  bar.innerHTML = "";
  const hidden = DATA.rows.filter(x => view.off.has(x.key)).length;
  chip(bar, "보기 설정" + (hidden ? " · " + hidden + "개 숨김" : ""), state.panel,
       () => { state.panel = !state.panel; render(); }, "set");
  bar.appendChild(el("span","sep"));
  SORTS.forEach(s => chip(bar, s[1], state.sort === s[0], () => { state.sort = s[0]; render(); }));
  bar.appendChild(el("span","sep"));
  chip(bar, "급매만", state.urgentOnly, () => { state.urgentOnly = !state.urgentOnly; render(); });
}

/* ── 보기 설정 ──────────────────────────── */
/* ── 알림 · 단지 관리 ───────────────────────
   버튼을 누르면 (비공개) 깃허브 저장소의 '새 이슈' 화면이 제목이 채워진 채 열린다.
   주인이 제출하면 서버가 다음 수집 때 읽어서 목록에 반영한다. */
function request(title, note){
  const url = DATA.admin.issues + "?title=" + encodeURIComponent(title) +
    "&body=" + encodeURIComponent((note || "") + "\n\n(시세표 화면에서 만든 요청입니다. 아래 Submit 을 누르면 다음 수집 때 반영됩니다.)");
  window.open(url, "_blank", "noopener");
  toast("깃허브에서 Submit 을 누르면 다음 수집(최대 30분) 때 반영됩니다.");
}
function toast(msg){
  const t = el("div","toast", esc(msg));
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}
function adminBlock(){
  const box = el("div","admin");
  box.appendChild(el("h2", null, "🔔 알림 · 단지 관리"));
  box.appendChild(el("div","hint",
    "평형마다 최저가가 새 매물이나 호가 인하로 내려가면 텔레그램으로 알립니다. " +
    "버튼을 누르면 깃허브 화면이 열리고, 거기서 <b>Submit new issue</b> 를 눌러야 반영됩니다. " +
    "본인 깃허브 계정으로 로그인돼 있어야 합니다."));

  const add = el("form","addrow");
  const inp = document.createElement("input");
  inp.placeholder = "네이버 부동산 단지 주소 붙여넣기";
  inp.setAttribute("aria-label", "추가할 단지 주소");
  const go = el("button","btn","단지 추가");
  go.type = "submit";
  add.appendChild(inp); add.appendChild(go);
  add.onsubmit = ev => {
    ev.preventDefault();
    const v = inp.value.trim();
    if(!v){ inp.focus(); return; }
    request("add " + v, "단지 추가 요청");
    inp.value = "";
  };
  box.appendChild(add);

  const byCx = new Map();
  DATA.rows.forEach(r => {
    if(!byCx.has(r.complex_no)) byCx.set(r.complex_no, []);
    byCx.get(r.complex_no).push(r);
  });
  [...byCx.values()]
    .sort((a,b) => a[0].region.localeCompare(b[0].region, "ko") || a[0].complex_name.localeCompare(b[0].complex_name, "ko"))
    .forEach(rows => {
      rows.sort((a,b) => a.area - b.area);
      const r0 = rows[0];
      const cx = el("div","adm-cx");
      const hd = el("div","adm-hd",
        '<span>' + esc(r0.complex_name) + '<span class="rg">' + esc(r0.region) + '</span></span>');
      const del = el("button","btn warn","삭제");
      del.onclick = () => request("remove " + r0.complex_no, r0.complex_name + " 삭제 요청");
      hd.appendChild(del);
      cx.appendChild(hd);

      const bells = el("div","bells");
      rows.forEach(r => {
        const b = el("button","bell" + (r.alert ? " on" : ""), (r.alert ? "🔔 " : "🔕 ") + r.area + "㎡");
        b.title = r.alert ? "알림 끄기 요청" : "알림 켜기 요청";
        b.onclick = () => request((r.alert ? "alert-off " : "alert-on ") + r.complex_no + " " + r.area,
          r0.complex_name + " " + r.area + "㎡ 알림 " + (r.alert ? "끄기" : "켜기"));
        bells.appendChild(b);
      });
      const areas = rows.map(r => r.area).join(",");
      const on = el("button","bell all","모두 켜기");
      on.onclick = () => request("alert-on " + r0.complex_no + " " + areas, r0.complex_name + " 알림 모두 켜기");
      const off = el("button","bell all","모두 끄기");
      off.onclick = () => request("alert-off " + r0.complex_no + " " + areas, r0.complex_name + " 알림 모두 끄기");
      bells.appendChild(on); bells.appendChild(off);
      cx.appendChild(bells);
      box.appendChild(cx);
    });
  return box;
}

function renderPanel(){
  const host = document.getElementById("panel");
  host.innerHTML = "";
  if(!state.panel) return;
  const p = el("div","panel");

  p.appendChild(el("h2", null, "급매 기준"));
  p.appendChild(el("div","hint","전고점보다 이만큼 이상 싸면 '급매'로 표시합니다."));
  const dr = el("div","pick-row");
  DROPS.forEach(d => chip(dr, "-" + d + "% 이상", state.drop === d,
    () => { state.drop = d; saveView(); render(); }));
  p.appendChild(dr);

  p.appendChild(el("h2", null, "볼 단지와 평형"));
  p.appendChild(el("div","hint","체크를 끄면 표에서 빠집니다. 선택은 이 기기에 저장됩니다."));
  const all = el("div","pick-row");
  chip(all, "전체 선택", false, () => { view.off.clear(); saveView(); render(); });
  chip(all, "전체 해제", false, () => { DATA.rows.forEach(r => view.off.add(r.key)); saveView(); render(); });
  p.appendChild(all);

  const byCx = new Map();
  DATA.rows.forEach(r => {
    if(!byCx.has(r.complex_no)) byCx.set(r.complex_no, []);
    byCx.get(r.complex_no).push(r);
  });
  [...byCx.values()]
    .sort((a,b) => a[0].region.localeCompare(b[0].region, "ko") || a[0].complex_name.localeCompare(b[0].complex_name, "ko"))
    .forEach(rows => {
      rows.sort((a,b) => a.area - b.area);
      const box = el("div","cx");
      const onCount = rows.filter(r => !view.off.has(r.key)).length;
      const hd = el("label","cx-hd");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = onCount > 0;
      cb.indeterminate = onCount > 0 && onCount < rows.length;
      cb.onchange = () => {
        rows.forEach(r => { if(cb.checked) view.off.delete(r.key); else view.off.add(r.key); });
        saveView(); render();
      };
      hd.appendChild(cb);
      hd.appendChild(el("span", null, esc(rows[0].complex_name) +
        ' <span class="rg">' + esc(rows[0].region) + '</span>'));
      box.appendChild(hd);

      const ars = el("div","cx-areas");
      rows.forEach(r => {
        const lb = el("label","ar");
        const c2 = document.createElement("input");
        c2.type = "checkbox";
        c2.checked = !view.off.has(r.key);
        c2.onchange = () => {
          if(c2.checked) view.off.delete(r.key); else view.off.add(r.key);
          saveView(); render();
        };
        lb.appendChild(c2);
        lb.appendChild(el("span", null, r.area + '㎡ <span class="pr num">' + eok(r.ask) + '억</span>'));
        ars.appendChild(lb);
      });
      box.appendChild(ars);
      p.appendChild(box);
    });
  if(DATA.admin) p.appendChild(adminBlock());
  host.appendChild(p);
}

/* ── 표 ─────────────────────────────────── */
function render(){
  renderBar(); renderPanel();
  const app = document.getElementById("app");
  app.innerHTML = "";
  const rows = visibleRows();
  const nu = rows.filter(isUrgent).length;

  app.appendChild(el("div","sum",
    '<span><b>' + rows.length + '</b>개 평형' +
      (nu ? ' · 급매 <b style="color:var(--urgent)">' + nu + '</b>건' : '') + '</span>' +
    '<span>급매 기준 -' + state.drop + '%</span>'));

  const card = el("div","card");
  card.appendChild(el("div","thead cols",
    '<div>최저호가</div><div>최근 실거래</div><div>전고점</div><div>낙폭</div>'));

  if(!rows.length){
    card.appendChild(el("div","empty",
      state.urgentOnly ? "급매 기준에 해당하는 매물이 없습니다."
                       : "표시할 평형이 없습니다. '보기 설정'에서 단지와 평형을 골라주세요."));
    app.appendChild(card);
    return;
  }

  let lastRegion = null;
  rows.forEach(r => {
    if(state.sort === "name" && r.region !== lastRegion){
      lastRegion = r.region;
      card.appendChild(el("div","ghead", esc(r.region || "지역 미상")));
    }
    const urgent = isUrgent(r);
    const b = document.createElement("button");
    b.className = "row" + (urgent ? " urgent" : "") + (state.open === r.key ? " open" : "");
    b.setAttribute("aria-expanded", state.open === r.key ? "true" : "false");
    const where = [r.ask_dong, r.ask_floor].filter(Boolean).join(" · ");
    b.innerHTML =
      '<div class="r1">' +
        '<div class="nm">' + esc(r.complex_name) + '<span class="ar2">' + r.area + '㎡</span>' +
          (urgent ? '<span class="badge">급매</span>' : '') + '</div>' +
        '<div class="where">' + esc(where) +
          (r.ask_fallback ? '<span class="tag">저층뿐</span>' : '') + '</div>' +
      '</div>' +
      '<div class="cols">' +
        '<div class="v ask"><div class="a num">' + eok(r.ask) + '</div>' +
          '<div class="s">매물 ' + r.count + '건</div></div>' +
        '<div class="v ref"><div class="a num">' + eok(r.rt_last) + '</div>' +
          '<div class="s num">' + (ym(r.rt_last_ym) || "거래 없음") + '</div></div>' +
        '<div class="v ref"><div class="a num">' + eok(r.peak) + '</div>' +
          '<div class="s num">' + (ym(r.peak_ym) || "–") + '</div></div>' +
        '<div class="v gap ' + gapClass(r.gap_pct) + '"><div class="a num">' + sgnPct(r.gap_pct) + '</div>' +
          '<div class="s num">' + (sgnEok(r.gap_amt) || "&nbsp;") + '</div></div>' +
      '</div>';
    b.onclick = () => { state.open = (state.open === r.key ? null : r.key); render(); };
    card.appendChild(b);
    if(state.open === r.key) card.appendChild(detailBlock(r));
  });
  app.appendChild(card);
  bindChart();
}

/* ── 펼침 상세 ──────────────────────────── */
function detailBlock(r){
  const d = el("div","detail");
  r.__ser = sliceSeries(r.series, state.range);

  const lg = el("div","legend",
    '<span><i class="swatch" style="background:var(--series-rt)"></i>실거래(월 중간값)</span>' +
    '<span><i class="swatch" style="background:var(--series-ask)"></i>최저호가</span>' +
    (r.peak ? '<span><i class="swatch" style="background:var(--ink-3);height:1px"></i>전고점</span>' : ''));
  const rg = el("span"); rg.style.cssText = "margin-left:auto;display:flex;gap:5px";
  [[12,"1년"],[36,"3년"],[0,"전체"]].forEach(x => {
    const b = document.createElement("button");
    b.className = "mini";
    b.setAttribute("aria-pressed", state.range === x[0] ? "true" : "false");
    b.textContent = x[1];
    b.onclick = ev => { ev.stopPropagation(); state.range = x[0]; render(); };
    rg.appendChild(b);
  });
  lg.appendChild(rg);
  d.appendChild(lg);
  d.appendChild(el("div", null, svgFor(r, "ch-" + r.key)));

  d.appendChild(el("div","lst-hd",
    '매물 ' + r.count + '건, 싼 순' + (r.excluded ? ' · 저층 ' + r.excluded + '건은 흐리게 표시' : '')));
  const shown = r.listings.slice(0, state.listAll === r.key ? 60 : 8);
  shown.forEach(l => {
    const urgent = l.g !== null && l.g !== undefined && l.g <= -state.drop && !l.low;
    const gc = (l.g === null || l.g === undefined) ? "" : (l.g < 0 ? "down" : "up");
    d.appendChild(el("div","li" + (l.low ? " low" : ""),
      '<span class="p num">' + eokFull(l.p) + '</span>' +
      '<span class="m">' + esc([l.d, l.f, l.dir].filter(Boolean).join(" · ")) +
        (l.low ? '<span class="tag">저층</span>' : '') +
        (l.cut ? '<span class="tag">' + (l.cut/10000).toFixed(1) + '억 인하</span>' : '') +
        (urgent ? '<span class="badge">급매</span>' : '') + '</span>' +
      '<span class="g num ' + gc + '">' + sgnPct(l.g) + '</span>'));
  });
  if(r.listings.length > shown.length){
    const m = document.createElement("button");
    m.className = "mini"; m.style.marginTop = "10px";
    m.textContent = "나머지 " + (r.listings.length - shown.length) + "건 더 보기";
    m.onclick = ev => { ev.stopPropagation(); state.listAll = r.key; render(); };
    d.appendChild(m);
  }
  const a = el("div", null,
    '<a class="more" target="_blank" rel="noopener" href="https://fin.land.naver.com/complexes/' +
    encodeURIComponent(r.complex_no) + '">네이버 부동산에서 이 단지 보기 →</a>');
  d.appendChild(a);
  return d;
}

/* ── 차트 ───────────────────────────────── */
const CH = {W:360, H:190, PT:12, PR:50, PB:28, PL:42};

function sliceSeries(s, n){
  if(!s) return {months:[], rt_median:[], rt_count:[], ask_min:[]};
  if(!n || s.months.length <= n) return s;
  const c = a => (a || []).slice(-n);
  return {months:c(s.months), rt_median:c(s.rt_median), rt_count:c(s.rt_count), ask_min:c(s.ask_min)};
}

function svgFor(r, id){
  const ser = r.__ser, ms = ser.months;
  const vals = [].concat(ser.rt_median, ser.ask_min, r.peak ? [r.peak] : [])
                 .filter(v => v !== null && v !== undefined);
  if(!ms || !ms.length || !vals.length) return '<div class="empty">추이 자료가 아직 없습니다.</div>';
  const W = CH.W, H = CH.H, PT = CH.PT, PR = CH.PR, PB = CH.PB, PL = CH.PL;
  const iw = W - PL - PR, ih = H - PT - PB;
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const pad = (hi - lo) * 0.12 || hi * 0.05;
  lo = Math.max(0, lo - pad); hi = hi + pad;
  const X = i => PL + (ms.length === 1 ? iw/2 : i * iw / (ms.length - 1));
  const Y = v => PT + ih - (v - lo) / (hi - lo) * ih;
  const F = 'font-family="IBM Plex Mono, monospace"';

  let grid = "", ticks = "";
  for(let k = 0; k <= 3; k++){
    const v = lo + (hi - lo) * k / 3, y = Y(v);
    grid += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>';
    ticks += '<text x="'+(PL-7)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--ink-3)" '+F+'>'+eok(v)+'</text>';
  }
  let xlab = "";
  const step = ms.length <= 14 ? 3 : (ms.length <= 40 ? 6 : 12);
  for(let i = ms.length - 1; i >= 0; i -= step){
    const m = ms[i];
    const txt = step < 12 ? m.slice(2,4)+"."+m.slice(4) : "'"+m.slice(2,4);
    xlab += '<text x="'+X(i).toFixed(1)+'" y="'+(H-PB+16)+'" text-anchor="middle" font-size="11" fill="var(--ink-3)" '+F+'>'+txt+'</text>';
  }
  let peakLine = "";
  if(r.peak && r.peak >= lo && r.peak <= hi){
    const y = Y(r.peak);
    peakLine = '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+
      '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="4 3" opacity=".75"/>';
  }
  const path = (arr, color) => {
    let dd = "", open = false, dots = "";
    const n = arr.filter(v => v !== null && v !== undefined).length;
    arr.forEach((v,i) => {
      if(v === null || v === undefined){ open = false; return; }
      dd += (open ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1) + " ";
      open = true;
    });
    arr.forEach((v,i) => {
      if(v === null || v === undefined) return;
      const p = arr[i-1], nx = arr[i+1];
      const iso = (p === null || p === undefined) && (nx === null || nx === undefined);
      if(iso || n <= 12) dots += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.4" fill="'+color+'"/>';
    });
    return '<path d="'+dd.trim()+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots;
  };
  const lastIdx = a => { for(let i=a.length-1;i>=0;i--) if(a[i]!==null&&a[i]!==undefined) return i; return -1; };
  const marks = [];
  [["rt_median","var(--series-rt)"],["ask_min","var(--series-ask)"]].forEach(pr => {
    const a = ser[pr[0]], i = lastIdx(a);
    if(i < 0) return;
    marks.push({x:X(i), y:Y(a[i]), ly:Y(a[i]), c:pr[1], t:eok(a[i])});
  });
  if(marks.length === 2 && Math.abs(marks[0].ly - marks[1].ly) < 14){
    marks.sort((a,b) => a.ly - b.ly);
    marks[0].ly -= 6; marks[1].ly += 8;
  }
  let ends = "";
  marks.forEach(m => {
    ends += '<circle cx="'+m.x.toFixed(1)+'" cy="'+m.y.toFixed(1)+'" r="3.3" fill="'+m.c+'" stroke="var(--sunk)" stroke-width="2"/>' +
      '<text x="'+(m.x+7).toFixed(1)+'" y="'+(m.ly+4).toFixed(1)+'" font-size="12" font-weight="600" fill="'+m.c+'" '+F+'>'+m.t+'</text>';
  });
  return '<svg id="'+id+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+
    esc(r.complex_name+" "+r.area)+'㎡ 실거래와 최저호가 추이">'+
    grid + peakLine + ticks + xlab +
    '<line x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'" stroke="var(--axis)" stroke-width="1"/>'+
    path(ser.rt_median, "var(--series-rt)") + path(ser.ask_min, "var(--series-ask)") + ends +
    '<line class="cross" x1="0" y1="'+PT+'" x2="0" y2="'+(H-PB)+'" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>'+
    '<rect class="hit" x="'+PL+'" y="'+PT+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg>';
}

function bindChart(){
  const tt = document.getElementById("tt");
  const r = DATA.rows.find(x => x.key === state.open);
  if(!r) return;
  const svg = document.getElementById("ch-" + r.key);
  if(!svg) return;
  const hit = svg.querySelector(".hit"), cross = svg.querySelector(".cross");
  const ser = r.__ser, ms = ser.months;
  if(!hit || !ms.length) return;
  const move = ev => {
    const bb = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    const px = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const py = ev.touches ? ev.touches[0].clientY : ev.clientY;
    const x = (px - bb.left) / bb.width * vb.width;
    const iw = vb.width - CH.PL - CH.PR;
    let i = Math.round((x - CH.PL) / iw * (ms.length - 1));
    i = Math.max(0, Math.min(ms.length - 1, i));
    const cx = CH.PL + (ms.length === 1 ? iw/2 : i * iw / (ms.length - 1));
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", ".35");
    tt.innerHTML =
      '<div class="m">20' + ms[i].slice(2,4) + '년 ' + Number(ms[i].slice(4)) + '월</div>' +
      '<div class="r"><i><span class="swatch" style="background:var(--series-rt)"></span>실거래</i>' +
        '<b class="num">' + (ser.rt_median[i] === null ? "거래 없음" : eokFull(ser.rt_median[i])) + '</b></div>' +
      '<div class="r"><i><span class="swatch" style="background:var(--series-ask)"></span>최저호가</i>' +
        '<b class="num">' + (ser.ask_min[i] === null ? "–" : eokFull(ser.ask_min[i])) + '</b></div>' +
      '<div class="r"><i>거래 건수</i><b class="num">' + (ser.rt_count[i] || 0) + '</b></div>';
    tt.style.opacity = "1";
    let lx = px + 12, ly = py - tt.offsetHeight - 12;
    if(lx + tt.offsetWidth > window.innerWidth - 8) lx = px - tt.offsetWidth - 12;
    if(ly < 8) ly = py + 16;
    tt.style.left = lx + "px"; tt.style.top = (ly + window.scrollY) + "px";
  };
  const leave = () => { tt.style.opacity = "0"; cross.setAttribute("opacity","0"); };
  hit.addEventListener("mousemove", move);
  hit.addEventListener("mouseleave", leave);
  hit.addEventListener("touchstart", move, {passive:true});
  hit.addEventListener("touchmove", move, {passive:true});
  hit.addEventListener("touchend", leave);
}

render();
}   // startApp 끝

/* ── 시작: 잠겨 있으면 비밀번호를 받아 푼다 ─────────────── */
(function boot(){
  const plain = JSON.parse(document.getElementById("payload").textContent);
  if(plain){ startApp(plain); return; }

  const L = JSON.parse(document.getElementById("locked").textContent);
  const PWKEY = "aptwatch.pw.v1";
  const wrap = document.getElementById("lockwrap"), form = document.getElementById("lockform");
  const inp = document.getElementById("lockpw"), keep = document.getElementById("lockkeep");
  const go = document.getElementById("lockgo"), err = document.getElementById("lockerr");
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function open(pw){
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:bytes(L.s), iterations:L.it, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:bytes(L.n)}, key, bytes(L.c));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function attempt(pw, fromStore){
    go.disabled = true; err.textContent = "";
    try{
      const data = await open(pw);
      try{ if(keep.checked || fromStore) localStorage.setItem(PWKEY, pw); else localStorage.removeItem(PWKEY); }catch(e){}
      wrap.hidden = true;
      startApp(data);
    }catch(e){
      try{ localStorage.removeItem(PWKEY); }catch(e2){}
      wrap.hidden = false;
      err.textContent = fromStore ? "저장된 비밀번호가 더 이상 맞지 않습니다. 다시 입력해 주세요."
                                  : "비밀번호가 맞지 않습니다.";
      inp.value = ""; inp.focus();
    }
    go.disabled = false;
  }
  form.addEventListener("submit", ev => { ev.preventDefault(); if(inp.value) attempt(inp.value, false); });

  if(!(window.crypto && crypto.subtle)){
    wrap.hidden = false;
    err.textContent = "이 브라우저에서는 열 수 없습니다. 최신 크롬이나 사파리로 열어주세요.";
    go.disabled = true;
    return;
  }
  let saved = null;
  try{ saved = localStorage.getItem(PWKEY); }catch(e){}
  if(saved) attempt(saved, true); else wrap.hidden = false;
})();
</script>
